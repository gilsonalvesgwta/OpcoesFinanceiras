name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dominio:
    name: Domínio (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Checar tipos
        run: npm run typecheck
      - name: Testar
        run: npm test
      - name: Guardar o package-lock.json gerado
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
